<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Alexander &amp; Lena – Wir heiraten</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Lora:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <img class="decor decor-top-left" src="/images/flowers-corner.svg" alt="">
  <img class="decor decor-top-right" src="/images/flowers-corner.svg" alt="">
  <img class="decor decor-bottom-left" src="/images/flowers-corner.svg" alt="">
  <img class="decor decor-bottom-right" src="/images/flowers-corner.svg" alt="">

  <header class="hero">
    <p class="eyebrow">Wir heiraten</p>
    <h1 class="script">Alexander &amp; Lena</h1>
    <img class="rings" src="/images/rings.svg" alt="">
    <p class="date">Samstag, 21. August 2027</p>
    <p class="place">Losheim am See - Mitlosheim · Weiskirchen</p>
    <div class="countdown" id="countdown" data-date="2027-08-21T14:00:00+02:00"></div>
  </header>

  <main>
    <figure class="photo photo-placeholder">Hier kommt unser Foto hin</figure>

    <section class="section">
      <h2>Eure Rückmeldung</h2>
      <p>Benutzername und Passwort findet ihr auf eurer Einladung.</p>
      <div class="divider"><img src="/images/rings.svg" alt=""></div>
      <form id="login-form">
        <label>Benutzername
          <input type="text" name="username" autocomplete="username" autocapitalize="none" required>
        </label>
        <label>Passwort
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="login-error" role="alert"></p>
        <div class="actions"><button type="submit">Anmelden</button></div>
      </form>
    </section>
  </main>

  <footer><img src="/images/rings.svg" alt=""></footer>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
